# Configures how GitHub groups merged PRs in auto-generated release notes
# (the "What's Changed" section). Apply labels to PRs to bucket them; PRs
# without a matching label fall through to "Other Changes".
#
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - ignore-for-release
    authors:
      - dependabot
      - renovate-bot

  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking-change
        - semver-major

    - title: 🚀 Features
      labels:
        - enhancement
        - feature

    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix

    - title: 🔒 Security
      labels:
        - security

    - title: 📚 Documentation
      labels:
        - documentation
        - docs

    - title: 🧰 Maintenance
      labels:
        - chore
        - refactor
        - ci
        - tests
        - dependencies

    - title: Other Changes
      labels:
        - "*"
